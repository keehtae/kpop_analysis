# Editable source for the Methodology page; inspired by the tidyverse elevators example.
# Rebuild with: python3 build_methodology.py (requires PyYAML).
# tables[].source.file declares the ONE shared workbook; use its real filename when known.
# Set x-source.sheet to the shared worksheet name when known.
# x-* fields are site extensions, not claims of official data-dict schema support.
# x-values describes expected units/ranges, not observed Excel minima/maxima.
# Each x-chart-links: [] is an optional list, e.g.:
#   x-chart-links:
#     - label: Tempo distribution
#       href: exploratory.html#tempo-distribution
# Add a link only after the destination chart and its HTML id exist.
# With one chart link the variable name links to it; more links appear below it.
$version: 0.1.0
$learn_more: https://data-dict.tidyverse.org/
description: Song-level audio features extracted with Essentia. All variables in this dictionary share
  one Excel workbook source.
tables:
- name: song_audio_features
  source:
    file: null
  x-source:
    format: Excel (.xlsx)
    sheet: null
    status: Workbook filename and worksheet pending
    description: All variables below share one Excel workbook. The filename and worksheet are awaiting
      confirmation.
  x-status: Variable descriptions are reproduced as supplied by the project author. All songs are at 44.1kHz.
    The shared Excel workbook filename and worksheet are awaiting confirmation.
  x-frame-note:
    title: From audio frames to song-level features
    description: 'All songs are at 44.1kHz.


      Spectral, dissonance, and MFCC values are calculated via frames. Frames are composed of 2048 samples,
      approximately 46.44ms at 44.1Khz. Therefore, a song contains thousands of frames, and each frame
      has its own spectral, dissonance, and MFCC values calculated. These values are averaged for each
      song, allowing for easier interpretability and comparison.'
  x-groups:
  - id: duration
    name: Song duration
    description: ''
    frame_based: false
    documentation: null
  - id: rhythm
    name: RhythmExtractor2013
    description: ''
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_RhythmExtractor2013.html
  - id: bpm
    name: BpmHistogramDescriptors
    description: ''
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_BpmHistogramDescriptors.html
  - id: onset
    name: OnsetRate
    description: ''
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_OnsetRate.html
  - id: danceability
    name: Danceability
    description: ''
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_Danceability.html
  - id: loudness
    name: LoudnessEBUR128
    description: All loudness values are based on the Loudness Units Full Scale (LUFS). THE LUFS scale
      quantifies the perceived loudness of a sound by mimicking human hearing. Values range from -70 to
      0, with values closer to 0 indicating a louder sound.
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_LoudnessEBUR128.html
  - id: centroid
    name: Centroid
    description: ''
    frame_based: true
    documentation: https://essentia.upf.edu/reference/std_Centroid.html
  - id: flux
    name: Flux
    description: ''
    frame_based: true
    documentation: https://essentia.upf.edu/reference/std_Flux.html
  - id: rolloff
    name: Rolloff
    description: ''
    frame_based: true
    documentation: https://essentia.upf.edu/reference/std_RollOff.html
  - id: dissonance
    name: Dissonance
    description: ''
    frame_based: true
    documentation: https://essentia.upf.edu/reference/std_Dissonance.html
  - id: mfcc
    name: MFCC
    description: 'MFCC’s refer to the mel frequency cepstrum coefficients, which describes the timbre
      of a song. To calculate the coefficients, the function uses a filterbank of 40 bands from 0 to 11000Hz,
      takes the log value of the spectrum energy in each mel band (a specific frequency range that mimics
      the human ear), and transforms the 40 bands to 13 mel coefficients through discrete cosine transformation
      (DCT).


      MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire song. Coefficients
      1-3 represents the overall spectral envelope of the song, while coefficients 4-13 capture specific
      spectral details, with coefficient 13 containing the most fine-grained details. Interpretations
      of these coefficients are impracticable, but they are useful in machine learning.'
    frame_based: true
    documentation: https://essentia.upf.edu/reference/std_MFCC.html
  - id: tonal
    name: TonalExtractor
    description: ''
    frame_based: false
    documentation: https://essentia.upf.edu/reference/std_TonalExtractor.html
  columns:
  - name: Duration_sec
    type: number
    x-values: Real number · seconds
    description: The duration of the song in seconds
    x-group: duration
    x-chart-links: []
  - name: Beats_count
    type: integer
    x-values: Integer
    description: the total number of beats in the song.
    x-group: rhythm
    x-chart-links: []
  - name: Tempo_bpm
    type: number
    x-values: Real number · BPM
    description: The song’s beats per minute. Calculated by taking a weighted average of all possible
      bpm’s.
    x-group: rhythm
    x-chart-links: []
  - name: First_peak_bpm
    type: number
    x-values: Real number · BPM
    description: The most likely bpm of the song.
    x-group: bpm
    x-chart-links: []
  - name: First_peak_weight
    type: number
    x-values: 0–1
    description: Confidence level that the predicted bpm is the actual bpm of the song. Ranges from 0-1.
    x-group: bpm
    x-chart-links: []
  - name: First_peak_spread
    type: number
    x-values: Real number
    description: Standard deviation of the most likely bpm
    x-group: bpm
    x-chart-links: []
  - name: Second_peak_bpm
    type: number
    x-values: Real number · BPM
    description: Second most likely predicted bpm of the song
    x-group: bpm
    x-chart-links: []
  - name: Second_peak_weight
    type: number
    x-values: 0–1
    description: Confidence level that the second most likely predicted bpm is the actual bpm of the song.
      Ranges from 0-1.
    x-group: bpm
    x-chart-links: []
  - name: Second_peak_spread
    type: number
    x-values: Real number
    description: Standard deviation of the second most likely bpm
    x-group: bpm
    x-chart-links: []
  - name: Bpm_histogram
    type: vector
    x-values: vector
    description: A histogram where each index value corresponds with a bpm. Each element corresponds with
      the confidence level of each bpm being the actual song’s bpm
    x-group: bpm
    x-chart-links: []
  - name: Onset_rate
    type: number
    x-values: Real number · onsets per minute
    description: The number of onsets per minute. An onset refers to the attack of a musical/percussive
      note.
    x-group: onset
    x-chart-links: []
  - name: Danceability
    type: number
    x-values: 0–3
    description: Danceability score. Values range from 0-3. The higher the score, the more danceable a
      song.
    x-group: danceability
    x-chart-links: []
  - name: Loudness_ebu128_integrated
    type: number
    x-values: −70–0 LUFS
    description: The overall loudness of a song.
    x-group: loudness
    x-chart-links: []
  - name: Loudness_ebu128_loudness_range
    type: number
    x-values: Real number
    description: The loudness range over an arbitrary long time interval. Computed from short-term (3
      second windows) loudness values, the loudness range is the difference between the 95th percentile
      and 10th percentile loudness values.
    x-group: loudness
    x-chart-links: []
    x-aliases:
    - Loudness_ebu128_loundess_range
  - name: Spectral_centroid_mean
    type: number
    x-values: Real number · Hz
    description: 'The average frequency of a song. Correlates with the perceived brightness of a sound:
      The larger the value the brighter the perceived sound.'
    x-group: centroid
    x-chart-links: []
  - name: Spectral_centroid_stdev
    type: number
    x-values: Real number
    description: The standard deviation of spectral_centroid_mean.
    x-group: centroid
    x-chart-links: []
  - name: Spectral_flux_mean
    type: number
    x-values: Real number
    description: The average frequency of change in the signal strength of frequencies over the course
      of the song.
    x-group: flux
    x-chart-links: []
  - name: Spectral_flux_stdev
    type: number
    x-values: Real number
    description: The standard deviation of spectral_flux_mean value.
    x-group: flux
    x-chart-links: []
  - name: Spectral_rolloff_mean
    type: number
    x-values: Real number · Hz
    description: The average frequency where ~85% of the total spectral energy of the song is contained.
      Provides information about timbre, texture, and energy of a song.
    x-group: rolloff
    x-chart-links: []
  - name: Spectral_rolloff_stdev
    type: number
    x-values: Real number
    description: The standard deviation of spectral_rolloff_mean.
    x-group: rolloff
    x-chart-links: []
  - name: Dissonance_mean
    type: number
    x-values: 0–1
    description: The average dissonance of the song. Values range from 0 (completely consonant) to 1 (completely
      dissonant).
    x-group: dissonance
    x-chart-links: []
  - name: Dissonance_stdev
    type: number
    x-values: Real number
    description: Standard deviation of dissonance_mean.
    x-group: dissonance
    x-chart-links: []
  - name: MFCC_mean_1
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_2
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_3
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_4
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_5
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_6
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_7
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_8
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_9
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_10
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_11
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_12
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: MFCC_mean_13
    type: number
    x-values: Real number · no fixed range
    description: MFCC_mean_# refer to the average mel frequency cepstrum coefficients across the entire
      song.
    x-group: mfcc
    x-chart-links: []
  - name: Chords_changes_rate
    type: number
    x-values: Real number
    description: The rate at which chords progress
    x-group: tonal
    x-chart-links: []
  - name: Chords_number_rate
    type: number
    x-values: Real number
    description: The ratio of different chords over the total number of chords in a progression
    x-group: tonal
    x-chart-links: []
