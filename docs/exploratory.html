<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exploratory | K-pop Data Atlas</title>
    <link rel="stylesheet" href="static/css/styles.css?v=essentia-exploratory-1" />
    <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
  </head>
  <body data-page="exploratory">
    <div class="site-shell">
      <header class="site-header">
        <div class="nav-wrap">
          <a class="brand-lockup" href="index.html">
            <span class="brand-kicker">K-pop chart analysis site</span>
            <span class="brand-title">K-pop Data Atlas</span>
          </a>
          <nav class="nav-links">
            <a class="nav-link" data-page="home" href="index.html">Home</a>
            <a class="nav-link" data-page="exploratory" href="exploratory.html">Exploratory</a>
            <a class="nav-link" data-page="models" href="models.html">Models</a>
            <a class="nav-link" data-page="music" href="music.html">Music</a>
            <a class="nav-link" data-page="methodology" href="methodology.html">Methodology</a>
          </nav>
        </div>
      </header>

      <main class="page-wrap">
        <h1 class="section-title audio-page-title">Exploratory</h1>
        <section id="duration">
          <div class="section-head"><h2 class="section-title">Duration</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="duration_sec" data-title="Duration" data-unit="Seconds" aria-label="Duration"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Duration commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="beat-count">
          <div class="section-head"><h2 class="section-title">Beat Count</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart" data-audio-histogram="beats_count" data-title="Beat Count" data-unit="Beats" aria-label="Beat Count"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Beat Count commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="tempo">
          <div class="section-head"><h2 class="section-title">Tempo</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart" data-audio-histogram="tempo_bpm" data-title="Tempo" data-unit="BPM" aria-label="Tempo"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Tempo commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="onset-rate">
          <div class="section-head"><h2 class="section-title">Onset Rate</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="onset_rate" data-title="Onset Rate" data-unit="" aria-label="Onset Rate"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Onset Rate commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="danceability">
          <div class="section-head"><h2 class="section-title">Danceability</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="danceability" data-title="Danceability" data-unit="" aria-label="Danceability"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Danceability commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="loudness">
          <div class="section-head"><h2 class="section-title">Loudness</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="loudness_ebu128_integrated" data-title="Integrated Loudness" data-unit="LUFS" aria-label="Integrated Loudness"></div></div><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="loudness_ebu128_loudness_range" data-title="Loudness Range" data-unit="LU" aria-label="Loudness Range"></div></div><div class="table-scroll audio-summary"><table class="data-table" data-audio-summary="audio" aria-label="Summary statistics"></table></div></article>
            <aside class="note-card audio-commentary" aria-label="Loudness commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="krumhansl-key">
          <div class="section-head"><h2 class="section-title">Krumhansl Key</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="audio-toolbar"><label for="key-view">View</label><select id="key-view"><option value="key">Key</option><option value="scale">Scale</option><option value="combined">Key + Scale</option></select></div><div class="chart-frame"><div class="js-chart" id="key-chart" aria-label="Krumhansl Key"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Krumhansl Key commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="chords">
          <div class="section-head"><h2 class="section-title">Chords</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="chords_changes_rate" data-title="Chord Changes Rate" data-unit="" aria-label="Chord Changes Rate"></div></div><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="chords_number_rate" data-title="Chord Number Rate" data-unit="" aria-label="Chord Number Rate"></div></div><div class="table-scroll audio-summary"><table class="data-table" data-audio-summary="chords" aria-label="Summary statistics"></table></div></article>
            <aside class="note-card audio-commentary" aria-label="Chords commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="spectral-values">
          <div class="section-head"><h2 class="section-title">Spectral Value Distributions</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="audio-toolbar"><label for="spectral-value">Spectral Value</label><select id="spectral-value"><option value="centroid">Centroid</option><option value="rolloff">Rolloff</option><option value="flux">Flux</option></select></div><div class="chart-frame"><div class="js-chart audio-boxplot" id="spectral-mean" aria-label="Spectral Mean"></div></div><div class="chart-frame"><div class="js-chart audio-boxplot" id="spectral-stdev" aria-label="Spectral Standard Deviation"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Spectral Value Distributions commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="dissonance">
          <div class="section-head"><h2 class="section-title">Dissonance</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="chart-frame"><div class="js-chart audio-boxplot" data-audio-box="dissonance_mean" data-title="Dissonance" data-unit="" aria-label="Dissonance"></div></div></article>
            <aside class="note-card audio-commentary" aria-label="Dissonance commentary"><p class="note-text"></p></aside>
          </div>
        </section>

        <section id="mfcc-boxplots">
          <div class="section-head"><h2 class="section-title">MFCC Boxplots</h2></div>
          <div class="chart-grid audio-chart-grid">
            <article class="chart-card"><div class="audio-toolbar"><label for="mfcc-value">MFCC</label><select id="mfcc-value"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option><option value="5">5</option><option value="6">6</option><option value="7">7</option><option value="8">8</option><option value="9">9</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option></select></div><div class="chart-frame"><div class="js-chart audio-boxplot" id="mfcc-chart" aria-label="MFCC Boxplot"></div></div><div class="table-scroll audio-summary"><table class="data-table" data-audio-summary="mfcc" aria-label="Summary statistics"></table></div></article>
            <aside class="note-card audio-commentary" aria-label="MFCC Boxplots commentary"><p class="note-text"></p></aside>
          </div>
        </section>
      </main>
    </div>
    <script src="static/js/essentia_exploratory.js?v=1"></script>
    <script src="static/js/main.js?v=essentia-exploratory-1"></script>
  </body>
</html>
